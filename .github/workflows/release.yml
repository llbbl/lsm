name: Release

# Single consolidated release workflow. Three trigger paths:
#
#   1. Auto path — `push: branches: [main]`. Compute the next version
#      from Conventional Commit subjects since the last tag, create
#      and push a `vX.Y.Z` annotated tag, then build and publish.
#
#   2. Manual major path — `push: tags: ['v*']`. A maintainer pushes a
#      `vX.0.0` tag from their workstation (their own credentials, not
#      GITHUB_TOKEN), this trigger fires, the version job is skipped,
#      and the release job builds against the pushed tag.
#
#   3. Manual back-fill path — `workflow_dispatch` with a required
#      `tag` input. Use the Actions UI to back-fill a missed release
#      against an existing tag.
#
# Major version bumps are intentionally MANUAL in the auto path. See
# docs/development.md "Releases" section. The version-bump logic
# treats `feat!:` and `BREAKING CHANGE:` as MINOR bumps — this guards
# against accidental 2.0/3.0 releases while the project is in rapid
# iteration. To cut a major release, use trigger path #2 above.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3) — used for back-filling missed releases"
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Determine version and tag
    # Only the auto path computes a new version. Tag-push and
    # workflow_dispatch skip this job and feed the existing tag
    # directly into the release job via the resolve-tag step.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.next }}
      skip: ${{ steps.version.outputs.skip }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true

      - name: Sanity check
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Determine next version
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest=$latest_tag"

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          commits=$(git log "$latest_tag"..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          if [ -z "$commits" ]; then
            echo "No new commits since $latest_tag; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Major bumps are MANUAL — see docs/development.md "Releases" section.
          # `feat!:` / `BREAKING CHANGE:` footers fall through to the feat branch
          # below (minor bump), NOT a major bump. This guards against accidental
          # 2.0 releases while the project is still in rapid-iteration mode.
          if echo "$commits" | grep -qE "^feat(\(.+\))?!?:"; then
            minor=$((minor + 1))
            patch=0
          elif echo "$commits" | grep -qE "^(fix|perf|refactor|chore)(\(.+\))?!?:"; then
            patch=$((patch + 1))
          else
            echo "No release-worthy commits since $latest_tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next="v${major}.${minor}.${patch}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from $latest_tag)"

      - name: Tag and push
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    name: Build and publish release
    needs: version
    # `always()` lets us evaluate the boolean even when `version` was
    # skipped (tag-push and workflow_dispatch paths). Without it, a
    # skipped dependency would skip this job by default.
    #
    # The three OR clauses match the three trigger paths:
    #   - auto path: version ran successfully and produced a tag
    #   - manual major path: push of a v* tag (version did not run)
    #   - back-fill path: workflow_dispatch (version did not run)
    if: |
      always() && (
        (needs.version.result == 'success' && needs.version.outputs.skip != 'true') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true

      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo orhun/git-cliff --pattern '*x86_64-unknown-linux-gnu.tar.gz' --output git-cliff.tar.gz
          tar xzf git-cliff.tar.gz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/

      - name: Generate changelog
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          git-cliff --tag "$TAG" --latest -o CHANGELOG.md

      - name: Build and package archives
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for platform in "${platforms[@]}"; do
            IFS='/' read -r os arch <<< "$platform"

            # Each archive is built from a clean per-platform staging dir
            # so it contains exactly: the binary (renamed to lsm/lsm.exe),
            # a tailored INSTALL.md, and LICENSE.
            stage="dist/stage-${os}-${arch}"
            rm -rf "$stage"
            mkdir -p "$stage"

            binname="lsm"
            template="scripts/install-templates/INSTALL-unix.md"
            if [ "$os" = "windows" ]; then
              binname="lsm.exe"
              template="scripts/install-templates/INSTALL-windows.md"
            fi

            echo "Building $os/$arch..."
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags="-s -w -X github.com/llbbl/lsm/internal/cmd.Version=$TAG" \
              -o "$stage/$binname" ./cmd/lsm

            cp "$template" "$stage/INSTALL.md"
            cp LICENSE "$stage/LICENSE"

            archive_base="lsm-${TAG}-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              echo "Packaging ${archive_base}.zip..."
              ( cd "$stage" && zip -q -r "../${archive_base}.zip" . )
            else
              echo "Packaging ${archive_base}.tar.gz..."
              tar czf "dist/${archive_base}.tar.gz" -C "$stage" .
            fi

            rm -rf "$stage"
          done

          # Include the installer as a release asset so the curl one-liner
          # always points at a published, versioned copy too.
          cp scripts/install.sh dist/install.sh

      - name: Create checksums
        run: |
          cd dist
          # Checksums cover the archives plus install.sh — no bare binaries.
          # Use bare globs (not ./*) so checksums.txt lists plain filenames,
          # which is the format scripts/install.sh greps for ("  <name>").
          sha256sum *.tar.gz *.zip install.sh > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt dist/install.sh \
            --title "$TAG" \
            --notes-file CHANGELOG.md
