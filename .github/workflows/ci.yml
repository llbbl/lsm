name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The toolchain patch version every job builds and tests against. go.mod
# declares the minimum supported version (1.25.0), not the one CI runs.
env:
  GO_VERSION: "1.25.14"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Print coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      # The action checks out the repo and installs Go itself, so this job
      # needs no separate checkout or setup-go step.
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}

  fmt:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  cross-build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keep this list in sync with the platforms=() array in
      # .github/workflows/release.yml. A non-host GOOS/GOARCH build break
      # (e.g. a symbol missing on windows) is invisible to the native-only
      # test/lint/fmt jobs and otherwise only surfaces at release time.
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOTOOLCHAIN: local
        run: go build ./...
