[tools]
go = "1.25"

[tasks.build]
run = "go build ./cmd/lsm"

[tasks.local]
run = 'go build -ldflags="-s -w" -o ~/.local/bin/lsm ./cmd/lsm'
description = "Build and install lsm to ~/.local/bin (version comes from BuildInfo)"

[tasks.test]
run = "go test ./..."

[tasks.test-cover]
run = "go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out | tail -1"

[tasks.changelog]
run = "git cliff -o CHANGELOG.md"

[tasks.changelog-preview]
run = "git cliff --unreleased"

# Release paths (git tag is the single source of truth — no VERSION file):
#   Automatic: PR merge → auto-release.yml determines bump type from commits → tags → release.yml builds
#   Manual:    mise run release-patch/minor/major → derives latest tag, increments, creates annotated tag, pushes → release.yml builds

[tasks.version]
run = "git describe --tags --always"
description = "Show current version (derived from git)"

[tasks.bump-patch]
description = "Increment patch version and create an annotated tag"
run = """
CUR=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
CUR=${CUR#v}
IFS='.' read -r major minor patch <<< "$CUR"
patch=$((patch + 1))
NEW="${major}.${minor}.${patch}"
git tag -a "v$NEW" -m "Release v$NEW"
echo "Bumped to $NEW (v$NEW)"
"""

[tasks.bump-minor]
description = "Increment minor version, reset patch, and create an annotated tag"
run = """
CUR=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
CUR=${CUR#v}
IFS='.' read -r major minor patch <<< "$CUR"
minor=$((minor + 1))
patch=0
NEW="${major}.${minor}.${patch}"
git tag -a "v$NEW" -m "Release v$NEW"
echo "Bumped to $NEW (v$NEW)"
"""

[tasks.bump-major]
description = "Increment major version, reset minor and patch, and create an annotated tag"
run = """
CUR=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
CUR=${CUR#v}
IFS='.' read -r major minor patch <<< "$CUR"
major=$((major + 1))
minor=0
patch=0
NEW="${major}.${minor}.${patch}"
git tag -a "v$NEW" -m "Release v$NEW"
echo "Bumped to $NEW (v$NEW)"
"""

[tasks.release-patch]
description = "Bump patch version and push with tags"
depends = ["bump-patch"]
run = "git push origin main --follow-tags"

[tasks.release-minor]
description = "Bump minor version and push with tags"
depends = ["bump-minor"]
run = "git push origin main --follow-tags"

[tasks.release-major]
description = "Bump major version and push with tags"
depends = ["bump-major"]
run = "git push origin main --follow-tags"
